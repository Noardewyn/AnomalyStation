; The macOS export preset of the client. `export-macos.sh` copies it to godot/export_presets.cfg (which .gitignore keeps out of the repository) and
; exports a .zip holding Anomaly Station.app, universal (Godot's mono template has only the universal binary; arm64 needs ETC2/ASTC import, project.godot), unsigned: export-macos.sh signs it ad hoc
; with rcodesign afterwards. Godot's built-in signer (codesign=1) writes two CodeDirectories into slot 0 and the hardened runtime flag, which `codesign -v`
; accepts but an M2 killed at launch (2026-11-16). Without the hardened runtime the .NET JIT needs none of the entitlements below; they stay unused.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="default-options.cfg"
exclude_filter=""
export_path="../build/macos/AnomalyStation.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=1
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
application/icon=""
application/bundle_identifier="io.github.noardewyn.anomalystation"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright=""
application/min_macos_version_x86_64="10.15"
application/min_macos_version_arm64="11.00"
display/high_res=true
codesign/codesign=0
codesign/installer_identity=""
codesign/apple_team_id=""
codesign/identity=""
codesign/entitlements/custom_file=""
codesign/entitlements/allow_jit_code_execution=true
codesign/entitlements/allow_unsigned_executable_memory=true
codesign/entitlements/disable_library_validation=true
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_executable_page_protection=false
codesign/entitlements/debugging=false
codesign/entitlements/audio_input=false
codesign/entitlements/camera=false
codesign/entitlements/location=false
codesign/entitlements/address_book=false
codesign/entitlements/calendars=false
codesign/entitlements/photos_library=false
codesign/entitlements/apple_events=false
codesign/entitlements/app_sandbox/enabled=false
codesign/custom_options=PackedStringArray()
notarization/notarization=0
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
