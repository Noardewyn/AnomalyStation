name: Set up the build
description: The .NET SDK, tgstation at the pinned commit as ../tgstation (docs/building.md#getting-tgstation) and the NuGet cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: AnomalyStation/global.json

    - name: Cache tgstation
      id: tg-cache
      uses: actions/cache@v4
      with:
        path: tgstation
        key: tgstation-${{ env.TG_COMMIT }}

    - name: Fetch tgstation
      if: steps.tg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git init tgstation
        git -C tgstation fetch --depth 1 https://github.com/tgstation/tgstation.git "$TG_COMMIT"
        git -C tgstation checkout FETCH_HEAD
        rm -rf tgstation/.git

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('AnomalyStation/**/*.csproj', 'AnomalyStation/**/*.props', 'AnomalyStation/global.json') }}
        restore-keys: nuget-
