; The Windows x64 export preset of the --bench run (docs/ai/specs/apps.md 2.11, D118). `export-windows.sh` copies it to godot/export_presets.cfg
; (which .gitignore keeps out of the repository) and exports. Not exercised on the Mac: it has no Windows export templates.

[preset.0]

name="Windows x64 (bench)"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="default-options.cfg"
exclude_filter=""
export_path="../build/win-x64/AnomalyStation.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/product_name="Anomaly Station"
application/file_description="Anomaly Station client (bench)"
application/company_name=""
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
