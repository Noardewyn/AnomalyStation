# The build and the quick tests (docs/testing.md) on every push to main and every pull request. The quick tests are split into
# shards that run side by side: one hosted runner would take hours over them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TG_COMMIT: 1d99bd7f599fcd687fd563cbe01370d0b020e46f
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, client, analyzers and map tools
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The .blend sources in LFS are not needed to build or test, so they are not downloaded.
      - uses: actions/checkout@v4
        with:
          path: AnomalyStation
          lfs: false
      - uses: ./AnomalyStation/.github/actions/setup
      - name: Build
        working-directory: AnomalyStation
        run: dotnet build AnomalyStation.sln -warnaserror
      - name: Build the client as its export is
        working-directory: AnomalyStation
        run: dotnet build godot/Anomaly.Client.csproj -c ExportDebug -warnaserror
      - name: Test
        working-directory: AnomalyStation
        run: |
          dotnet test tests/Anomaly.Analyzers.Tests --no-build --filter "Category!=Meta"
          dotnet test tools/Anomaly.Tools.Maps/Tests --no-build --filter "Category!=Meta"

  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server (gameplay)
            project: tests/Anomaly.Server.Tests
            filter: FullyQualifiedName~Anomaly.Server.Tests.Integration.
          - name: server (the rest)
            project: tests/Anomaly.Server.Tests
            filter: FullyQualifiedName!~Anomaly.Server.Tests.Integration.
          - name: core (tg)
            project: tests/Anomaly.Core.Tests
            filter: FullyQualifiedName~Anomaly.Core.Tests.Tg.
          - name: core (gaps)
            project: tests/Anomaly.Core.Tests
            filter: FullyQualifiedName~Anomaly.Core.Tests.Gaps.
          - name: core (the rest)
            project: tests/Anomaly.Core.Tests
            filter: FullyQualifiedName!~Anomaly.Core.Tests.Tg.&FullyQualifiedName!~Anomaly.Core.Tests.Gaps.
    steps:
      - uses: actions/checkout@v4
        with:
          path: AnomalyStation
          lfs: false
      - uses: ./AnomalyStation/.github/actions/setup
      - name: Build
        working-directory: AnomalyStation
        run: dotnet build ${{ matrix.project }}
      # The client's model, sound and bot tests read tg's converted icons and sounds (tools/convert-tg.sh without Godot's import).
      - name: Convert tg's icons and sounds
        if: contains(matrix.project, 'Server')
        working-directory: AnomalyStation
        run: |
          dotnet run --project tools/Anomaly.Tools.Icons -- --tg ../tgstation --out godot/assets/tg
          dotnet run --project tools/Anomaly.Tools.Sounds -- --tg ../tgstation --out godot/assets/tg
      - name: Test
        working-directory: AnomalyStation
        env:
          # A hosted runner has far less memory than the 32 GB the full parallel quick run wants (docs/testing.md#memory).
          DOTNET_GCHeapHardLimit: "0x180000000"
        run: dotnet test ${{ matrix.project }} --no-build --filter "Category!=Meta&${{ matrix.filter }}"
